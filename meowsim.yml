name: Build MeowSim

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create project
        run: |
          mkdir app && cd app
          echo '' | base64 -d | tar xz
          find . -type f | sort
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Build rpk
        working-directory: app
        run: npm run build
      - name: Upload .rpk
        uses: actions/upload-artifact@v4
        with:
          name: MeowSim
          path: app/dist/*.rpk
          if-no-files-found: error
